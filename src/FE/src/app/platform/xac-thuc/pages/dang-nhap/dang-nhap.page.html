<app-auth-page>
  <app-auth-card
    [brandName]="tenHeThong"
    [title]="'xacThuc.dangNhap.tieuDe' | translate"
    [description]="cheDoVanHanh() ? ('xacThuc.dangNhap.moTaCheDoVanHanh' | translate) : null"
    [errorMessage]="loiChung()"
  >
    <form [formGroup]="form" (ngSubmit)="gui()" [attr.aria-busy]="dangGui() ? 'true' : null">
      @if (cheDoVanHanh()) {
        <app-auth-field
          #oMaDonVi
          variant="tenantCode"
          controlId="dang-nhap-ma-don-vi"
          [label]="'xacThuc.dangNhap.maDonVi' | translate"
          autocomplete="organization"
          [formControl]="form.controls.tenantCode"
          [errorMessage]="loiCua('tenantCode')"
        />
      }

      <app-auth-field
        #oTenDangNhap
        variant="identifier"
        controlId="dang-nhap-ten-dang-nhap"
        [label]="'xacThuc.dangNhap.tenDangNhap' | translate"
        autocomplete="username"
        [formControl]="form.controls.userName"
        [errorMessage]="loiCua('userName')"
      />

      <app-auth-field
        #oMatKhau
        variant="password"
        controlId="dang-nhap-mat-khau"
        [label]="'xacThuc.dangNhap.matKhau' | translate"
        autocomplete="current-password"
        [formControl]="form.controls.password"
        [errorMessage]="loiCua('password')"
      />

      <app-button variant="primary" size="lg" [block]="true" type="submit" [loading]="dangGui()">
        {{ 'xacThuc.dangNhap.nutGui' | translate }}
      </app-button>
    </form>

    <!-- Điều hướng thật trên cùng tuyến (ADR-0116 QC2): <a app-button>, không <app-button>
         (Button.md §Liên kết mang hình thức nút). Đang gửi thì không có href, aria-disabled, bấm
         không đổi URL. -->
    <a
      app-button
      variant="ghost"
      size="md"
      [routerLink]="dangGui() ? null : []"
      [queryParams]="thamSoChuyenCheDo()"
      queryParamsHandling="merge"
      [disabled]="dangGui()"
    >
      {{
        (cheDoVanHanh()
          ? 'xacThuc.dangNhap.lienKetCheDoThuong'
          : 'xacThuc.dangNhap.lienKetCheDoVanHanh'
        ) | translate
      }}
    </a>
  </app-auth-card>

  <app-footer
    variant="auth"
    size="sm"
    [showDivider]="false"
    [copyright]="
      'chung.chanTrang.banQuyen' | translate: { nam: namHienTai, tenHeThong: tenHeThong }
    "
    [version]="maCommit ? ('chung.chanTrang.phienBan' | translate: { ma: maCommit }) : null"
  />
</app-auth-page>
