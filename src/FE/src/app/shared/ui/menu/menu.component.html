<p-menu
  #primeMenu
  [popup]="true"
  appendTo="body"
  [model]="model()"
  [ariaLabel]="ariaLabel()"
  [styleClass]="'app-menu app-menu--' + size()"
  (onShow)="onShow()"
  (onHide)="onHide()"
>
  @if (header()) {
    <ng-template #start>
      <div class="app-menu__tieu-de">{{ header() }}</div>
    </ng-template>
  }
</p-menu>
