<nav class="pagination" [attr.aria-label]="ariaLabel()">
  @if (totalRecords() > 0) {
    <span class="pagination__khoang">{{
      'chung.phanTrang.khoang' | translate: thamSoKhoang()
    }}</span>
    <p-paginator
      appendTo="body"
      [class.pagination__paginator--disabled]="disabled() || loading()"
      [first]="first()"
      [rows]="pageSize()"
      [totalRecords]="totalRecords()"
      [rowsPerPageOptions]="tuyChonSoDongMutable()"
      (onPageChange)="onPageChange($event)"
    />
  }
</nav>
