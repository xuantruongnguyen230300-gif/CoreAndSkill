@if (copyright() || version() || links().length > 0) {
  <footer
    class="footer"
    [class.footer--auth]="variant() === 'auth'"
    [class.footer--sm]="size() === 'sm'"
    [class.footer--khong-vach]="!showDivider()"
  >
    <div class="footer__trai">
      @if (copyright()) {
        <span>{{ copyright() }}</span>
      }
      @if (version()) {
        <span>{{ version() }}</span>
      }
    </div>

    @if (variant() === 'full' && links().length > 0) {
      <nav class="footer__lien-ket">
        @for (l of links(); track l.href) {
          <a [href]="l.href" [target]="l.external ? '_blank' : null" [rel]="l.external ? 'noopener' : null">
            {{ l.label }}
            @if (l.external) {
              <i class="pi pi-external-link" aria-hidden="true"></i>
            }
          </a>
        }
      </nav>
    }
  </footer>
}
