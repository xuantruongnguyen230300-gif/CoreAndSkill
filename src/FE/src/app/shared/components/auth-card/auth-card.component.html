<main class="auth-card-vung">
  <div class="auth-card" [attr.aria-busy]="loading() ? 'true' : null">
    <h1 class="auth-card__tieu-de">{{ title() }}</h1>

    @if (description()) {
      <p class="auth-card__mo-ta">{{ description() }}</p>
    }

    @if (errorMessage()) {
      <div class="auth-card__khu-loi" role="alert">
        <i class="pi pi-times-circle" aria-hidden="true"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <ng-content></ng-content>
  </div>
</main>
