<main class="auth-card-vung">
  <div class="auth-card">
    @if (brandName()) {
      <p class="auth-card__thuong-hieu">{{ brandName() }}</p>
    }

    <h1 class="auth-card__tieu-de">{{ title() }}</h1>

    @if (description()) {
      <p class="auth-card__mo-ta">{{ description() }}</p>
    }

    @if (errorMessage()) {
      <app-notice-banner
        class="auth-card__khu-loi"
        severity="danger"
        [heading]="'chung.thongBao.loi' | translate"
        >{{ errorMessage() }}</app-notice-banner
      >
    }

    <ng-content></ng-content>
  </div>
</main>
