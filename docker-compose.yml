# Bản cài thật — docs/wiki-core/be/18-trien-khai-va-van-hanh.md §7 (chốt 2026-09-15): một máy chủ
# Linux, Docker Compose, bí mật qua biến môi trường do Compose cấp từ tệp .env NGOÀI repo (không
# commit — .gitignore đã loại). Xem .env.example để biết khoá cần đặt.
#
# HTTPS kết thúc ở service `caddy` (ADR-0120): hai tên miền con API_DOMAIN và FE_DOMAIN phải trỏ DNS về máy chủ
# TRƯỚC lần khởi động đầu, nếu không Caddy xin chứng chỉ thất bại liên tục và có thể chạm giới hạn của Let's Encrypt.
#
# CHƯA CHẠY THỬ TRONG MÔI TRƯỜNG NÀY — không có Docker daemon lúc viết (ghi trong báo cáo B3).
#
# KHÔNG tự áp schema, KHÔNG tự bootstrap — hai việc đó CHẠY TAY theo
# docs/database/script-runbook.md §3.3 (ADR-0009 "áp schema chạy tay"). File này chỉ dựng runtime:
# database + API. Sau khi hai container lên, chạy TAY:
#   1. bước 1-3 của script-runbook.md §3.3 (tạo tài khoản, áp database/scripts/core/*.sql, cấp quyền) bằng
#      `docker compose exec db psql -U postgres ...` — thư mục database/scripts gắn chỉ-đọc ở /scripts trong `db`
#   2. docker compose run --rm api core bootstrap
#      (image đã có ENTRYPOINT ["dotnet", "CoreAndSkill.Api.dll"] — chỉ truyền tham số lệnh; script-runbook.md §3.3)

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      # ADR-0120 QC4 (docs/adr/0120-https-ket-thuc-o-caddy-trong-compose-header-chia-doi-postgres-quan-tri-cum-rieng-quet-bundle-fe-khi-dung-ban-cai.md):
      # tài khoản quản trị CỤM là `postgres`, riêng. coreandskill_owner (NOSUPERUSER) và coreandskill_app do runbook
      # §3.3 bước 1 tạo. KHÔNG đặt POSTGRES_DB: database rỗng cũng do bước 1 tạo (chủ là coreandskill_owner).
      # POSTGRES_USER/PASSWORD chỉ có tác dụng khi volume còn rỗng.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - coreandskill-db-data:/var/lib/postgresql/data
      # Script schema gắn CHỈ-ĐỌC để chạy bước 1-3 của runbook bằng `docker compose exec db psql` (ADR-0120 QC4).
      - ./database/scripts:/scripts:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # KHÔNG expose cổng ra ngoài host — chỉ container `api` trên cùng mạng compose chạm được DB
    # (docs/wiki-core/be/09-security-beyond-auth.md — bề mặt tấn công nhỏ nhất có thể).

  api:
    build:
      context: .
      dockerfile: src/BE/CoreAndSkill.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # KHÔNG publish cổng ra host — chỉ Caddy (mạng edge) chạm được API (ADR-0120 quyết định 1).
    networks:
      - edge
      - internal
    volumes:
      # Kho tệp tải lên / tệp xuất tạm — SAO LƯU CÙNG DB và phục hồi về CÙNG mốc thời gian
      # (docs/wiki-core/be/14-file-storage.md §8): phục hồi lệch mốc sinh ra tệp mồ côi và bản ghi mất tệp.
      - coreandskill-files:/var/lib/coreandskill/files
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Thứ tự ưu tiên: tệp mặc định → tệp theo môi trường → BIẾN MÔI TRƯỜNG thắng
      # (docs/wiki-core/be/18-trien-khai-va-van-hanh.md §2). "__" thay cho ":" — quy ước chuẩn của
      # Microsoft.Extensions.Configuration cho biến môi trường.
      ConnectionStrings__Core: "Host=db;Port=5432;Database=${POSTGRES_DB:-coreandskill};Username=${POSTGRES_APP_USER};Password=${POSTGRES_APP_PASSWORD}"
      Core__Auth__CookieName: ${CORE_AUTH_COOKIE_NAME:-coreandskill.session}
      Core__Auth__AntiforgeryCookieName: ${CORE_AUTH_ANTIFORGERY_COOKIE_NAME:-coreandskill.antiforgery}
      Core__Auth__SessionMinutes: ${CORE_AUTH_SESSION_MINUTES:-30}
      Core__Auth__SessionAbsoluteHours: ${CORE_AUTH_SESSION_ABSOLUTE_HOURS:-12}
      # Origin FE mà BE cho phép (CORS + kiểm Origin của antiforgery) DỰNG TỪ CHÍNH FE_DOMAIN — một bản cài một origin FE
      # (ADR-0116), nên không có biến thứ hai để người cài gõ lệch. Caddy phục vụ FE ở https://$FE_DOMAIN (cổng 443).
      Core__Auth__AllowedOrigins__0: "https://${FE_DOMAIN:?Thiếu FE_DOMAIN trong tệp .env - đặt tên miền FE không kèm https:// và không có dấu / cuối, ví dụ app.congty.vn}"
      # Proxy tin cậy (ADR-0120 QC2): đúng dải của mạng `edge` bên dưới — chỉ Caddy và `api` nằm trong đó. Không phải
      # bí mật nên khai ở đây. Dải đụng mạng máy chủ khách thì đổi CẢ `ipam` của `edge` LẪN khoá này.
      Core__Network__KnownNetworks__0: 172.28.0.0/24
      # Core:File:RootPath — BẮT BUỘC khi dùng bản lưu đĩa của Core (bản cài này dùng nó), không có giá trị mặc
      # định (thiếu thì tiến trình không khởi động — docs/wiki-core/be/14-file-storage.md §2, ADR-0107). Trùng đường dẫn thư mục tạo trong Dockerfile và gắn volume bên
      # dưới; đổi một nơi thì đổi cả ba. Không phải bí mật nên không đi qua .env.
      Core__File__RootPath: /var/lib/coreandskill/files
      # Core:Bootstrap:* — CHỈ cần lúc chạy lệnh `core bootstrap` (không ValidateOnStart —
      # docs/quy-uoc/be-architecture.md §4.4). Khai sẵn ở đây để `docker compose run api ... core
      # bootstrap` đọc được cùng bộ biến với tiến trình phục vụ thật.
      Core__Bootstrap__SystemTenantCode: ${CORE_BOOTSTRAP_SYSTEM_TENANT_CODE}
      Core__Bootstrap__SystemTenantName: ${CORE_BOOTSTRAP_SYSTEM_TENANT_NAME}
      Core__Bootstrap__FirstTenantCode: ${CORE_BOOTSTRAP_FIRST_TENANT_CODE}
      Core__Bootstrap__FirstTenantName: ${CORE_BOOTSTRAP_FIRST_TENANT_NAME}
      Core__Bootstrap__OperatorUserName: ${CORE_BOOTSTRAP_OPERATOR_USERNAME}
      Core__Bootstrap__OperatorPassword: ${CORE_BOOTSTRAP_OPERATOR_PASSWORD}
      Core__Bootstrap__OperatorEmail: ${CORE_BOOTSTRAP_OPERATOR_EMAIL}
      Core__Bootstrap__AdminUserName: ${CORE_BOOTSTRAP_ADMIN_USERNAME}
      Core__Bootstrap__AdminPassword: ${CORE_BOOTSTRAP_ADMIN_PASSWORD}
      Core__Bootstrap__AdminEmail: ${CORE_BOOTSTRAP_ADMIN_EMAIL}

  # Kết thúc HTTPS, chuyển hướng HTTP sang HTTPS, tự cấp/gia hạn chứng chỉ, chuyển tiếp tới `api` (ADR-0120 QC1).
  # Cấu hình ở ./Caddyfile. Bản cài trong mạng nội bộ không có tên miền công khai: nạp chứng chỉ của khách bằng
  # chỉ thị `tls` ở Caddyfile và gắn hai tệp chứng chỉ (NGOÀI repo) vào container.
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      FE_DOMAIN: ${FE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Tệp tĩnh FE (Caddyfile, khối {$FE_DOMAIN}): thư mục máy chủ chứa artifact build FE, NGOÀI git. Triển khai chép
      # đè vào đó, không xoá tệp băm bản trước (docs/wiki-core/fe/17-phuc-vu-va-trien-khai.md §3.3, §8).
      - ${FE_WWW_DIR:-./fe-www}:/srv/fe:ro
      # Chứng chỉ và khoá tài khoản ACME — MẤT volume thì xin lại, Let's Encrypt giới hạn số lần cấp mỗi tuần.
      - coreandskill-caddy-data:/data
      - coreandskill-caddy-config:/config
    networks:
      - edge

networks:
  # Dải cố định, chỉ Caddy và `api` (ADR-0120 QC2). Khớp Core__Network__KnownNetworks__0 ở service `api`.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # `api` và `db`; `db` không nằm trong `edge`.
  internal:

volumes:
  coreandskill-caddy-data:
  coreandskill-caddy-config:
  coreandskill-db-data:
  coreandskill-files:
